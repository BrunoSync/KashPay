services:
  api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    build: .
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5